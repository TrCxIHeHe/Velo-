[alembic]
script_location = alembic
# Without this, Windows (and some Linux setups) won't put the current
# directory on sys.path when the `alembic` command runs, so `from app.config
# import settings` in alembic/env.py fails with
# "ModuleNotFoundError: No module named 'app'" even when you're standing in
# backend\ with the venv active. This tells Alembic to add "." (backend\)
# to sys.path itself before running env.py.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
