# CI: runs the full backend test suite on every push and pull request.
#
# WHY THIS MATTERS
# -----------------
# Multiple people share one repo. Without CI, a broken commit only gets
# discovered when someone else pulls latest and their local `pytest` (or
# worse, their running app) breaks -- at which point nobody knows
# immediately whose change caused it. This workflow runs on GitHub's
# servers, fully independent of anyone's laptop, and blocks a PR from
# looking "safe to merge" if the tests don't pass.
#
# PYTHON VERSION: pinned to 3.11 here and in backend/docker/Dockerfile, to
# match. All current dependencies support 3.10+ (verified against PyPI
# metadata), so local dev on 3.10 also works -- 3.11 is just the version
# CI and the Docker image standardize on for reproducibility. See
# CHANGE_LOG.md for the reasoning on why 3.11 was chosen over 3.12.
#
# KNOWN GAP: this uses SQLite (see backend/tests/conftest.py), not a real
# Postgres service container. That's intentional for now, matching how the
# suite already runs locally with zero external dependencies -- but it
# means SELECT FOR UPDATE row-locking (used in WalletRepository and
# DockRepository) is never actually exercised under real Postgres
# concurrency here. A `services: postgres: ...` block plus a dedicated
# concurrency test must be added before this is trusted for a pilot with
# real money moving through the wallet ledger -- see FULL_SYSTEM_REPORT.md.
name: Backend CI

on:
  push:
    branches: [main, integration/main]
  pull_request:
    branches: [main, integration/main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run tests
        run: pytest -v

      - name: Lint (ruff)
        run: ruff check app tests
        continue-on-error: true  # non-blocking for now -- tighten once the codebase is ruff-clean
